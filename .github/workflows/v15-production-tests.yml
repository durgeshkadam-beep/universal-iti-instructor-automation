name: V15 Production Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v15/**'
      - 'final/**'
      - 'firestore.rules'
      - 'tests/v15-production-test.js'
      - 'tests/phase1-security-rules-test.js'
      - 'tests/phase1-skill-firestore-emulator-test.js'
      - 'tests/phase1-skill-gap-test.js'
      - 'tests/phase1-skill-gap-dom-test.js'
      - 'tests/v15-final-dom-test.js'
      - 'tests/v15-lexical-app-bridge-test.js'
      - 'tests/v15-final-polish-test.js'
      - '.github/workflows/v15-production-tests.yml'
  pull_request:
    paths:
      - 'v15/**'
      - 'final/**'
      - 'firestore.rules'
      - 'tests/v15-production-test.js'
      - 'tests/phase1-security-rules-test.js'
      - 'tests/phase1-skill-firestore-emulator-test.js'
      - 'tests/phase1-skill-gap-test.js'
      - 'tests/phase1-skill-gap-dom-test.js'
      - 'tests/v15-final-dom-test.js'
      - 'tests/v15-lexical-app-bridge-test.js'
      - 'tests/v15-final-polish-test.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install browser and Firebase test dependencies
        run: npm install --no-save --ignore-scripts jsdom@25 firebase@11.10.0 @firebase/rules-unit-testing@4.0.1
      - name: Validate Firestore security rules with emulator
        run: npx --yes firebase-tools@14.23.0 emulators:exec --only firestore --project demo-universal-iti --non-interactive "node tests/phase1-skill-firestore-emulator-test.js"
      - name: Run static and syntax tests
        run: node tests/v15-production-test.js && node --check v15/v15-skill-verification.js
      - name: Run Phase 1 security rules regression checks
        run: node tests/phase1-security-rules-test.js
      - name: Run Student Skill Gap calculation tests
        run: node tests/phase1-skill-gap-test.js
      - name: Run lexical App bridge regression test
        run: node tests/v15-lexical-app-bridge-test.js
      - name: Run role/menu DOM smoke tests
        run: node tests/v15-final-dom-test.js
      - name: Run Student Skill Gap DOM tests
        run: node tests/phase1-skill-gap-dom-test.js
      - name: Run Principal/workspace final polish tests
        run: node tests/v15-final-polish-test.js
