name: Deploy Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked development tooling
        run: npm ci --ignore-scripts

      - name: Verify Firebase configuration
        run: |
          test -f firebase.json
          test -f firestore.rules
          npx --no-install firebase --version

      - name: Deploy Firestore security rules
        env:
          ITI_DEPLOY_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$ITI_DEPLOY_PROJECT"
          npx --no-install firebase deploy --only firestore:rules --project "$ITI_DEPLOY_PROJECT" --non-interactive
