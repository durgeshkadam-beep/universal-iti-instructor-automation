name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p android-app assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Universal-ITI-Automation-v1.0-RC1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universal-ITI-Automation-APK
          path: Universal-ITI-Automation-v1.0-RC1.apk
          if-no-files-found: error
          retention-days: 30
