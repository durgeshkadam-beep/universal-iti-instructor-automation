<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repairing V15</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#0b2740;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.12);max-width:460px;text-align:center}.spin{width:40px;height:40px;border:4px solid #dbe5ec;border-top-color:#0b2740;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#667085}</style></head><body><div class="box"><div class="spin"></div><h2>Repairing V15 workspace</h2><p>Removing only old app caches and installing the dedicated V15 worker.</p><small>Your trainee records, Firebase data and browser localStorage are not deleted.</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/universal-iti-instructor-automation/')){try{await r.unregister();}catch(e){}}}}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>/^iti-v(1[345])|^iti-v15|^iti-v14/i.test(k)).map(k=>caches.delete(k)));}if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});try{await reg.update();}catch(e){}await navigator.serviceWorker.ready;}sessionStorage.setItem('iti-v15-repaired','1');location.replace('./index.html?build=production-12&fresh='+Date.now());}catch(e){document.querySelector('.box').innerHTML='<h2>Repair could not finish</h2><p>'+String(e.message||e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</p><p>Reload this page once while online.</p>';}})();</script></body></html>
