<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2740">
<title>Universal ITI V15</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#0b2740;font-family:Arial,sans-serif}.box{max-width:520px;margin:20px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.10);text-align:center}.spin{width:42px;height:42px;border:4px solid #dce5ec;border-top-color:#0b2740;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#667085;line-height:1.5}.err{color:#a61b1b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loaderBox">
  <div class="spin"></div>
  <h2>Universal ITI V15</h2>
  <p>Preparing the secure V15 workspace…</p>
  <small>Production 12 • dedicated cache • role-safe startup</small>
</div>
<script>
(async function(){
  try{
    // V15 has its own service worker. This prevents an older V13/V14 root cache
    // from randomly returning HTML for a V15 JavaScript file and leaving an empty sidebar.
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./sw.js?build=prod12',{scope:'./',updateViaCache:'none'});
      try{await reg.update();}catch(e){}
      await navigator.serviceWorker.ready;
      const controlled=(navigator.serviceWorker.controller?.scriptURL||'').includes('/v15/sw.js');
      if(!controlled&&!sessionStorage.getItem('iti-v15-dedicated-sw-reload')){
        sessionStorage.setItem('iti-v15-dedicated-sw-reload','1');
        location.replace('./index.html?build=production-12&sw=1&fresh='+Date.now());
        return;
      }
      sessionStorage.removeItem('iti-v15-dedicated-sw-reload');
    }

    const res=await fetch('../index.html?v15-shell=20260824-prod12-'+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('Could not load the current app shell. HTTP '+res.status);
    let html=await res.text();
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="../">');
    html=html.replace(/<link\s+rel=["']manifest["']\s+href=["']manifest\.json["'][^>]*>/i,'<link rel="manifest" href="v15/manifest.json">');
    html=html.replace(/<\/head>/i,`<style id="v15BootGuardStyle">
      #v15BootGuard{position:fixed;inset:0;z-index:2147483647;background:#f5f7fb;display:grid;place-items:center;font-family:Arial,sans-serif;color:#0b2740}
      #v15BootGuard .v15g{width:min(520px,calc(100% - 38px));background:#fff;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.12);text-align:center}
      #v15BootGuard .v15spin{width:42px;height:42px;border:4px solid #dce5ec;border-top-color:#0b2740;border-radius:50%;margin:0 auto 16px;animation:v15spin 1s linear infinite}@keyframes v15spin{to{transform:rotate(360deg)}}
      #v15BootGuard button{border:0;border-radius:10px;padding:11px 18px;background:#0b756f;color:#fff;font-weight:700;cursor:pointer}
    </style></head>`);
    html=html.replace(/<body([^>]*)>/i,`<body$1><div id="v15BootGuard"><div class="v15g"><div class="v15spin"></div><h2>Universal ITI V15</h2><p id="v15BootGuardText">Loading your authorized workspace…</p><small>Production 12 • Please wait. The older V13/V14 shell is intentionally hidden during startup.</small></div></div>`);
    const v15=`
<script>if(!window.SecurityPatch){document.write('<script src="security-patch.js"><\\/script>')}<\/script>
<script src="v15/v15-core.js?v=20260824-prod12"><\/script>
<script src="v15/v15-data.js?v=20260824-prod12"><\/script>
<script src="v15/v15-access.js?v=20260824-prod12"><\/script>
<script src="v15/v15-ui.js?v=20260824-prod12"><\/script>
<script src="v15/v15-auth-roles-v2.js?v=20260824-prod12"><\/script>
<script src="v15/v15-workspaces-v2.js?v=20260824-prod12"><\/script>
<script src="v15/v15-governance-v2.js?v=20260824-prod12"><\/script>
<script src="v15/v15-portals-v2.js?v=20260824-prod12"><\/script>
<script src="v15/v15-boot-final.js?v=20260824-prod12"><\/script>
`;
    html=html.replace(/<\/body>/i,v15+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    const box=document.getElementById('loaderBox');
    if(box) box.innerHTML='<h2>V15 could not start</h2><p class="err">'+String(e.message||e).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</p><p><a href="./recover.html">Run V15 cache repair</a></p><small>V14 and Firebase records were not changed.</small>';
  }
})();
</script>
</body>
</html>
