<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2740">
<title>Universal ITI FINAL</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#0b2740;font-family:Arial,sans-serif}.box{max-width:520px;margin:20px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.10);text-align:center}.spin{width:42px;height:42px;border:4px solid #dce5ec;border-top-color:#0b2740;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#667085;line-height:1.5}.err{color:#a61b1b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loaderBox">
  <div class="spin"></div>
  <h2>Universal ITI FINAL</h2>
  <p>Preparing the secure institute workspace…</p>
  <small>Final Build 17 • standalone Admin / Principal / Staff / Student portals</small>
</div>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./sw.js?build=final17',{scope:'./',updateViaCache:'none'});
      try{await reg.update();}catch(e){}
      await navigator.serviceWorker.ready;
    }
    const res=await fetch('../index.html?v15-shell=20260824-final17-'+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('Could not load the current app shell. HTTP '+res.status);
    let html=await res.text();
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="../">');
    html=html.replace(/<title>[^<]*<\/title>/i,'<title>Universal ITI FINAL</title>');
    html=html.replace(/<link\s+rel=["']manifest["']\s+href=["']manifest\.json["'][^>]*>/i,'<link rel="manifest" href="v15/manifest.json">');
    html=html.replace(/Universal Instructor Automation V14/gi,'Universal ITI FINAL');
    html=html.replace(/Instructor Automation\s*•\s*V13/gi,'V15 FINAL workspace');
    html=html.replace(/Instructor tools/gi,'V15 FINAL workspace');
    const v15=`
<script>if(!window.SecurityPatch){document.write('<script src="security-patch.js"><\\/script>')}<\/script>
<script src="v15/v15-core.js?v=20260824-final17"><\/script>
<script src="v15/v15-data.js?v=20260824-final17"><\/script>
<script src="v15/v15-access.js?v=20260824-final17"><\/script>
<script src="v15/v15-ui.js?v=20260824-final17"><\/script>
<script src="v15/v15-auth-roles-v2.js?v=20260824-final17"><\/script>
<script src="v15/v15-session-bridge.js?v=20260824-final17"><\/script>
<script src="v15/v15-workspaces-v2.js?v=20260824-final17"><\/script>
<script src="v15/v15-governance-v2.js?v=20260824-final17"><\/script>
<script src="v15/v15-portals-v2.js?v=20260824-final17"><\/script>
<script src="v15/v15-boot-final.js?v=20260824-final17"><\/script>
<script src="v15/v15-role-enforcer.js?v=20260824-final17"><\/script>
<script src="v15/v15-runtime-role-fix.js?v=20260824-final17"><\/script>
<script src="v15/v15-router-final.js?v=20260824-final17"><\/script>
<script src="v15/v15-final-portals.js?v=20260824-final17"><\/script>
`;
    html=html.replace(/<\/body>/i,v15+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    const box=document.getElementById('loaderBox');
    if(box) box.innerHTML='<h2>Universal ITI FINAL could not start</h2><p class="err">'+String(e.message||e).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</p><p><a href="./recover.html">Run safe cache repair</a></p><small>Firebase, V14 backup and trainee records were not changed.</small>';
  }
})();
</script>
</body>
</html>
