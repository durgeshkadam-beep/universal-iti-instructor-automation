<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2740">
  <title>Universal ITI Instructor Automation</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;color:#0b2740;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .box{background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.10);text-align:center;max-width:420px;margin:20px}
    .spin{width:38px;height:38px;border:4px solid #dbe3ea;border-top-color:#0b2740;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    small{color:#667085}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h2>Universal ITI Instructor Automation</h2>
    <p>Preparing secure cloud connection and latest app update…</p>
    <small>Firebase configuration is built into this app. No JSON setup is required on this device.</small>
  </div>
<script>
(async function(){
  const firebaseConfig = {
    apiKey: "AIzaSyBqfRWJT9h9JKBWNUYpkSG2olHinOSZdEM",
    authDomain: "universal-iti-auto-dk.firebaseapp.com",
    projectId: "universal-iti-auto-dk",
    storageBucket: "universal-iti-auto-dk.firebasestorage.app",
    messagingSenderId: "337752379271",
    appId: "1:337752379271:web:5c30c0855a118cf604cd22",
    measurementId: "G-JEXW0X54KF"
  };
  const key='iti-v14-cloud-settings';
  let settings={};
  try{ settings=JSON.parse(localStorage.getItem(key)||'{}')||{}; }catch(e){ settings={}; }
  settings.firebaseConfig=JSON.stringify(firebaseConfig);
  if(typeof settings.autoSync!=='boolean') settings.autoSync=false;
  if(!settings.driveFolderName) settings.driveFolderName='Universal ITI Instructor Automation';
  localStorage.setItem(key,JSON.stringify(settings));

  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      try{await reg.update();}catch(e){}
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(resolve=>{
          const timer=setTimeout(resolve,3500);
          navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timer);resolve();},{once:true});
        });
      }
    }catch(e){console.warn('Service worker preparation skipped',e);}
  }
  location.replace('./index.html');
})();
</script>
</body>
</html>
